		<script>
			let quotes;
			document.addEventListener("DOMContentLoaded", () => {
				fetch("/data/quotes.json")
					.then((response) => response.json())
					.then((data) => {
						quotes = data;
						newQuote();
						document.getElementById("randomquote").addEventListener("click", newQuote);
					})
					.catch((error) => console.error("Error loading quotes:", error));
				const lastGame = localStorage.getItem("obsidian.lastGame");
				if (lastGame) {
					try {
						const game = JSON.parse(decodeURIComponent(atob(lastGame)));
						const card = document.getElementById("continuecard");
						card.href = "/loader.html#" + lastGame;
						document.getElementById("continueicon").src = "/" + (game[3] || "semag") + "/" + game[0] + "/" + decodeURIComponent(game[1]);
						document.getElementById("continuename").innerText = game[2] + (game[3] == "sppa" ? " (App)" : "");
						card.style.display = "flex";
					} catch (error) {
						console.error("Error loading last game:", error);
					}
				}
			});
			function newQuote() {
				if (typeof quotes == "undefined") return;
				let randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
				if (randomQuote.includes("OGNUM1") && randomQuote.includes("SQRTNUM1")) {
					const ognum = Math.floor(Math.random() * 3000);
					randomQuote = `the square root of ${ognum} is ${Math.sqrt(ognum)}`;
				} else if (randomQuote.includes("CURRENTURL")) {
					randomQuote = window.location.hostname;
				}
				document.getElementById("randomquote").innerHTML = randomQuote;
			}
		</script>
