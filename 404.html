    <main id="main" class="noscroll">
      <h1>Page not found!</h1>

      <p class="trintro">Well, since you're here... you might as well play a typing game.</p>
      <div id="typerace">
        <h2>Typing race</h2>
        <p id="trhint">Click anywhere and start typing!</p>
        <div id="trphrase"></div>
        <div id="trstats">
          <span id="trwpm">0 WPM</span>
          <span id="tracc">100%</span>
        </div>
        <button id="trrestart" style="display: none;" onclick="trStart()">Race again</button>

    <script>
      const trPhrases = [
        "you found the 404 page now type fast before the teacher comes",
        "obsidian is the best unblocked games site and that is a fact",
        "this page does not exist but your typing speed definitely does",
        "better thank me for this unblocked website or no games for you",
        "error four oh four means the page ran away from school",
        "the cake is a lie but the games are all real and free",
        "type fast and maybe you will unlock the secret vatican theme",
        "random quote generator go brrr while you wait here",
      ];
      let trText = "", trPos = 0, trErrors = 0, trTotal = 0, trStartTime = null, trDone = false, trTimer = null;

      function trBuild() {
        const el = document.getElementById("trphrase");
        el.innerHTML = "";
        for (let i = 0; i < trText.length; i++) {
          const s = document.createElement("span");
          s.textContent = trText[i];
          el.appendChild(s);
        }
        el.children[0].classList.add("tr-cur");
      }
      function trRender() {
        const children = document.getElementById("trphrase").children;
        for (let i = 0; i < children.length; i++) {
          children[i].classList.remove("tr-ok", "tr-bad", "tr-cur");
          if (i < trPos) children[i].classList.add("tr-ok");
        }
        if (trPos < children.length) children[trPos].classList.add("tr-cur");
      }
      function trUpdateStats() {
        const minutes = (Date.now() - trStartTime) / 60000;
        const wpm = minutes > 0 ? Math.round(trPos / 5 / minutes) : 0;
        document.getElementById("trwpm").innerText = wpm + " WPM";
        document.getElementById("tracc").innerText = trTotal ? Math.round((1 - trErrors / trTotal) * 100) + "%" : "100%";
      }
      function trStart() {
        trText = trPhrases[Math.floor(Math.random() * trPhrases.length)];
        trPos = 0; trErrors = 0; trTotal = 0; trStartTime = null; trDone = false;
        document.getElementById("trrestart").style.display = "none";
        document.getElementById("trhint").innerText = "Click anywhere and start typing!";
        trBuild();
        trUpdateStats();
        if (trTimer) clearInterval(trTimer);
        trTimer = setInterval(trUpdateStats, 500);
      }
      document.addEventListener("keydown", (e) => {
        if (trDone) return;
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (e.target.tagName == "INPUT" || e.target.tagName == "TEXTAREA" || e.target.tagName == "SELECT") return;
        if (e.key === "Backspace") {
          if (trPos > 0) trPos--;
          e.preventDefault();
          trRender();
        } else if (e.key.length === 1) {
          if (!trStartTime) trStartTime = Date.now();
          if (e.key === trText[trPos]) {
            trPos++;
            trTotal++;
          } else {
            trErrors++;
            trTotal++;
            const children = document.getElementById("trphrase").children;
            if (children[trPos]) children[trPos].classList.add("tr-bad");
          }
          trRender();
          trUpdateStats();
          if (trPos === trText.length) {
            trDone = true;
            clearInterval(trTimer);
            document.getElementById("trhint").innerText = "Finished!";
            document.getElementById("trrestart").style.display = "";
          }
        }
      });
      document.addEventListener("DOMContentLoaded", trStart);
    </script>

  </body>
