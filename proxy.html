		<script>
			document.addEventListener("DOMContentLoaded", () => {
				const proxyFrame = document.getElementById("proxyFrame");
				const loadScreen = document.getElementById("loadscreen");
				proxyFrame.onload = () => {
					proxyFrame.style.opacity = "1";
					setTimeout(() => {
						loadScreen.style.opacity = "0";
						setTimeout(() => loadScreen.remove(), 500);
					}, 250);
				};
				proxyFrame.style.opacity = "0";
				proxyFrame.style.transition = "opacity 0.5s ease";
				document.getElementById("fullscreen").addEventListener("click", () => {
					const frame = document.getElementById("proxyFrame");
					if (document.fullscreenElement) {
						document.exitFullscreen();
					} else {
						frame.requestFullscreen();
					}
				});
			});
		</script>

		<link rel="stylesheet" href="/style.css?v=2" />
		<link rel="manifest" href="/manifest.json" />

	<alerts>
		<div id="toast"></div>
		<script>
			$.getJSON("data/changelog.json", (data) => {
				if (localStorage.getItem("obsidian.version") != data.version) {
					toast({ title: "New Update!", message: data.desc, time: data.timestamp });
					localStorage.setItem("obsidian.version", data.version);
				}
			});
			function toast(message, type) {
				const toast = document.getElementById("toast");
				toast.innerHTML = `<div class=samerow><h1>${message.title} - ${timeAgo(new Date(message.time * 1000))}</h1></div><p>${message.message}</p>`;
				toast.style.animation = "toastFade 6s";
			}
			function timeAgo(input) {
				const date = input instanceof Date ? input : new Date(input);
				const formatter = new Intl.RelativeTimeFormat("en");
				const ranges = {
					years: 3600 * 24 * 365,
					months: 3600 * 24 * 30,
					weeks: 3600 * 24 * 7,
					days: 3600 * 24,
					hours: 3600,
					minutes: 60,
					seconds: 1,
				};
				const secondsElapsed = (date.getTime() - Date.now()) / 1000;
				for (let key in ranges) {
					if (ranges[key] < Math.abs(secondsElapsed)) {
						const delta = secondsElapsed / ranges[key];
						return formatter.format(Math.round(delta), key);
					}
				}
			}
		</script>
	</alerts>
